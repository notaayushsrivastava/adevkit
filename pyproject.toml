[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adevkit"
version = "0.1.4"
description = "Aayush's DevKit - Single command project initialisation with agent skills and environments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aayush Srivastava", email = "contact@aayushsrivastava.com" }
]
maintainers = [
    { name = "Aayush Srivastava", email = "contact@aayushsrivastava.com" }
]
urls = { Homepage = "https://aayushsrivastava.com", Repository = "https://github.com/notaayushsrivastava/adevkit" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "inquirerpy>=0.3.4",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
adevkit = "adevkit.cli:main"
devkit = "adevkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adevkit*"]

[tool.setuptools.package-data]
"*" = ["*.*", "**/*", "**/**/*"]
