name: Publish adevkit APT repository

on:
  workflow_run:
    workflows: ["Build, Release & Publish adevkit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Build, Release & Publish adevkit run ID containing the linux-artifacts artifact"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: packages
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine package version
        id: version
        run: |
          VERSION="$(find packages -maxdepth 1 \( -name 'notaayushsrivastava.adevkit_*_amd64.deb' -o -name 'adevkit_*_amd64.deb' \) -printf '%f\n' | sed -E 's/^(notaayushsrivastava\.)?adevkit_([^_]+)_amd64\.deb$/\2/' | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils gnupg

      - name: Build signed repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY"
          chmod +x installer/build_apt_repo.sh
          ./installer/build_apt_repo.sh "${{ steps.version.outputs.version }}" packages apt-repo

      - name: Verify APT repository metadata
        shell: bash
        run: |
          set -euo pipefail
          packages_index="apt-repo/dists/stable/main/binary-amd64/Packages"
          release_file="apt-repo/dists/stable/Release"
          keyring="apt-repo/adevkit-archive-keyring.gpg"

          package_path="$(awk '/^Filename: / { print $2; exit }' "$packages_index")"
          test -n "$package_path"
          case "$package_path" in
            /*|apt-repo/*)
              echo "Invalid APT Filename path: $package_path" >&2
              exit 1
              ;;
          esac
          test -f "apt-repo/$package_path"

          if grep -Eq '^[[:xdigit:]]+[[:space:]]+[0-9]+[[:space:]]+Release$' "$release_file"; then
            echo "Release metadata must not contain a checksum entry for itself." >&2
            exit 1
          fi

          gpgv --keyring "$keyring" apt-repo/dists/stable/InRelease
          gpgv --keyring "$keyring" apt-repo/dists/stable/Release.gpg "$release_file"
          echo "APT package path and signatures verified."

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apt-repo
          force_orphan: true
