name: Build, Release & Publish adevkit

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag override (e.g. 0.1.4). Leave empty to read from pyproject.toml'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install Dependencies & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Execute Pytest Suite
        run: |
          pytest tests/ -v

  build-windows:
    name: Build Windows Executable & MSI Installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout Code with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Determine Release Version
        id: get_version
        shell: pwsh
        run: |
          $verInput = "${{ github.event.inputs.release_version }}".Trim()
          if ($verInput) {
            $version = $verInput.TrimStart('v')
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $content = Get-Content "pyproject.toml" -Raw
            if ($content -match 'version\s*=\s*["'']([^"'']+)["'']') {
              $version = $matches[1]
            } else {
              $version = "0.1.4"
            }
          }
          Write-Host "Determined Release Version: $version" -ForegroundColor Green
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG_NAME=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller build

      - name: Compile Standalone Executable (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm adevkit.spec
          if (!(Test-Path "dist\adevkit.exe")) {
            Write-Error "dist\adevkit.exe was not created."
            exit 1
          }
          # Create devkit.exe alias for backward-compatibility
          Copy-Item "dist\adevkit.exe" "dist\devkit.exe" -Force
          Write-Host "Verifying compiled executable:" -ForegroundColor Cyan
          & "dist\adevkit.exe" info

      - name: Prepare Output Directory & Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "output" -Force | Out-Null
          $zipPath = "output\devkit-v$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "dist\adevkit.exe", "dist\devkit.exe" -DestinationPath $zipPath -Force
          Write-Host "Created portable archive: $zipPath" -ForegroundColor Green

      - name: Build Python Distribution (Wheel & Source Archive)
        shell: pwsh
        run: |
          python -m build --outdir output
          Write-Host "Generated distribution packages in output/" -ForegroundColor Green

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.15\bin"
          if (Test-Path $wixPath) {
            echo "$wixPath" >> $env:GITHUB_PATH
          }

      - name: Build Native Windows MSI Installer
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.15\bin;$env:PATH"
          .\installer\build_msi.ps1 -Version $env:VERSION -DistDir "dist" -OutputDir "output"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: output/*

  build-linux:
    name: Build Linux Binary & Debian Package
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Determine Release Version
        id: get_version
        run: |
          VER_INPUT="${{ github.event.inputs.release_version }}"
          if [ -n "$VER_INPUT" ]; then
            VERSION="${VER_INPUT#v}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m 1 '^version =' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
            [ -z "$VERSION" ] && VERSION="0.1.4"
          fi
          echo "Determined Release Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Standalone Executable (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm adevkit.spec
          if [ ! -f "dist/adevkit" ]; then
            echo "Error: dist/adevkit was not created." >&2
            exit 1
          fi
          chmod +x dist/adevkit
          cp -f dist/adevkit dist/devkit
          echo "Verifying compiled executable:"
          ./dist/adevkit info

      - name: Build Linux Tarball & Debian Package (.deb)
        run: |
          chmod +x ./installer/build_linux.sh
          ./installer/build_linux.sh "$VERSION" "dist" "output"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: output/*

  build-macos:
    name: Build macOS Binary & PKG Installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest

    steps:
      - name: Checkout Code with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Determine Release Version
        id: get_version
        run: |
          VER_INPUT="${{ github.event.inputs.release_version }}"
          if [ -n "$VER_INPUT" ]; then
            VERSION="${VER_INPUT#v}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m 1 '^version =' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
            [ -z "$VERSION" ] && VERSION="0.1.4"
          fi
          echo "Determined Release Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Standalone Executable (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm adevkit.spec
          if [ ! -f "dist/adevkit" ]; then
            echo "Error: dist/adevkit was not created." >&2
            exit 1
          fi
          chmod +x dist/adevkit
          cp -f dist/adevkit dist/devkit
          echo "Verifying compiled executable:"
          ./dist/adevkit info

      - name: Build macOS Tarball & Apple PKG Installer (.pkg)
        run: |
          chmod +x ./installer/build_macos.sh
          ./installer/build_macos.sh "$VERSION" "dist" "output"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: output/*

  publish-github-release:
    name: Publish Multi-Platform Release to GitHub
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: get_version
        run: |
          VER_INPUT="${{ github.event.inputs.release_version }}"
          if [ -n "$VER_INPUT" ]; then
            VERSION="${VER_INPUT#v}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m 1 '^version =' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
            [ -z "$VERSION" ] && VERSION="0.1.4"
          fi
          echo "Determined Release Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Consolidate Output & Copy Installer Scripts
        run: |
          mkdir -p output
          find downloaded_artifacts -type f -exec cp {} output/ \;
          cp installer/install.sh output/install.sh
          cp installer/install-apt.sh output/install-apt.sh
          echo "Collected release artifacts in output/:"
          ls -la output/

      - name: Generate Checksums
        run: |
          python -c '
          import os, glob, hashlib
          files = sorted(glob.glob("output/*"))
          lines = []
          for f in files:
              if os.path.isfile(f) and not f.endswith("SHA256SUMS.txt"):
                  with open(f, "rb") as fp:
                      h = hashlib.sha256(fp.read()).hexdigest()
                  lines.append(f"{h}  {os.path.basename(f)}")
          with open("output/SHA256SUMS.txt", "w") as fp:
              fp.write("\n".join(lines) + "\n")
          '
          echo "Generated SHA256SUMS.txt:"
          cat output/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: adevkit (${{ env.TAG_NAME }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output/*.msi
            output/*.pkg
            output/*.deb
            output/*.zip
            output/*.whl
            output/*.tar.gz
            output/install.sh
            output/install-apt.sh
            output/SHA256SUMS.txt
          body: |
            ## adevkit (${{ env.TAG_NAME }}) - Aayush's DevKit
            
            Single-command project scaffolding with Agentic skills (`.agents/skills/`), custom templates, multi-assistant AI guidelines, secure credential vault, and automated environment configuration.
            
            ---
            
            ### Quick Installation Options
            
            #### 1. Universal One-Line Installer (Linux & macOS)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/notaayushsrivastava/adevkit/main/installer/install.sh | bash
            ```
            
            #### 2. Via PyPI (`pip install`) - All Platforms
            ```bash
            pip install --upgrade adevkit
            ```
            Once installed, run:
            ```bash
            adevkit init
            ```
            
            #### 3. Native Platform Installers
            
            - **Windows**: Download and run **`AayushsDevKit-v${{ env.VERSION }}-x64.msi`**.
              - Installs to `C:\Program Files\Aayush's DevKit\`
              - **Configures system PATH automatically** so `adevkit` (and alias `devkit`) are globally available anywhere in PowerShell/CMD.
              - Portable standalone zip: **`devkit-v${{ env.VERSION }}-windows-x64.zip`**
            
            - **macOS (Apple Silicon & Intel)**:
              - Double-click installer: **`AayushsDevKit-v${{ env.VERSION }}-macos.pkg`** (installs `adevkit` directly to `/usr/local/bin` with `devkit` symlink).
              - Or extract archive: **`devkit-v${{ env.VERSION }}-macos-arm64.tar.gz`**
            
            - **Linux (Ubuntu / Debian / Mint)**:
              - Debian package: `sudo dpkg -i notaayushsrivastava.adevkit_${{ env.VERSION }}_amd64.deb` (or via APT: `sudo apt install notaayushsrivastava.adevkit`)
              - Or extract archive: **`devkit-v${{ env.VERSION }}-linux-x64.tar.gz`**
            
            ---
            
            ### Verification & Quick Start
            Open a terminal and verify installation:
            ```bash
            adevkit info
            ```
            
            Initialize a new project:
            ```bash
            adevkit init
            ```
            
            ---
            
            ### Integrity Verification
            Verify downloads against **`SHA256SUMS.txt`**:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

  publish-pypi:
    name: Build & Publish Package to PyPI (adevkit)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
