name: Submit to Windows Package Manager (WinGet)

on:
  workflow_run:
    workflows: ["Build, Release & Publish adevkit"]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag override (e.g. 0.1.4). Leave empty to read from pyproject.toml'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

jobs:
  publish-winget:
    name: Generate & Submit WinGet Manifest
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: version
        shell: pwsh
        run: |
          $verInput = "${{ github.event.inputs.release_version }}".Trim()
          if ($verInput) {
            $version = $verInput.TrimStart('v')
          } elseif ('${{ github.event_name }}' -eq 'release') {
            $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          } else {
            $content = Get-Content "pyproject.toml" -Raw
            if ($content -match 'version\s*=\s*["'']([^"'']+)["'']') {
              $version = $matches[1]
            } else {
              $version = "0.1.4"
            }
          }
          Write-Host "Target Version for WinGet: $version" -ForegroundColor Green
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG_NAME=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download Windows Artifacts (workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-artifacts
          path: output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MSI Installer from GitHub Release (Fallback)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "output" -Force | Out-Null
          $msiPath = "output\AayushsDevKit-v$env:VERSION-x64.msi"
          if (!(Test-Path $msiPath)) {
            $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/AayushsDevKit-v$env:VERSION-x64.msi"
            Write-Host "Attempting download of published MSI from $url..." -ForegroundColor Cyan
            try {
              Invoke-WebRequest -Uri $url -OutFile $msiPath -ErrorAction Stop
              Write-Host "Successfully downloaded $msiPath" -ForegroundColor Green
            } catch {
              Write-Host "Notice: Release asset not yet downloadable from URL or not published yet ($url). Using manifest templates." -ForegroundColor Yellow
            }
          }

      - name: Generate and Validate WinGet Manifest
        shell: pwsh
        run: |
          .\installer\build_winget_manifest.ps1 -Version "$env:VERSION" -Repo "${{ github.repository }}" -Validate

      - name: Upload WinGet Manifests Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: installer/winget/manifests/**

      - name: Setup .NET 9 Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download wingetcreate CLI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          Write-Host "Downloaded wingetcreate CLI tool." -ForegroundColor Green

      - name: Submit Pull Request to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: \${{ secrets.WINGET_TOKEN || secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $packageId = "notaayushsrivastava.adevkit"
          $msiUrl = "https://github.com/\${{ github.repository }}/releases/download/$env:TAG_NAME/AayushsDevKit-v$env:VERSION-x64.msi"
          $manifestDir = Join-Path $PWD "installer\winget\manifests\n\notaayushsrivastava\adevkit\$env:VERSION"

          if (-not (Test-Path $manifestDir -PathType Container)) {
            throw "Generated WinGet manifest directory was not found: $manifestDir"
          }

          $manifestFiles = @(Get-ChildItem -Path $manifestDir -Filter "*.yaml" -File)
          if ($manifestFiles.Count -ne 3) {
            throw "Expected exactly 3 WinGet YAML manifests in '$manifestDir'; found $($manifestFiles.Count)."
          }

          if (-not $env:WINGET_TOKEN -or $env:WINGET_TOKEN.Trim() -eq "") {
            Write-Host "::warning::WINGET_TOKEN (or WINGET_CREATE_GITHUB_TOKEN) secret is not configured."
            Write-Host "The generated WinGet manifests were validated and uploaded as an artifact."
            Write-Host "Configure WINGET_TOKEN to enable automated submissions."
            exit 0
          }

          $env:WINGET_CREATE_GITHUB_TOKEN = $env:WINGET_TOKEN
          $packageManifestApi = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/n/notaayushsrivastava/adevkit"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:WINGET_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "adevkit-winget-submission"
          }

          # "update" requires an existing package manifest; use "submit" for the first release.
          $packageExists = $false
          try {
            $null = Invoke-RestMethod -Uri $packageManifestApi -Headers $headers -Method Get -ErrorAction Stop
            $packageExists = $true
          } catch {
            $statusCode = $null
            if ($_.Exception.Response) {
              try { $statusCode = [int]$_.Exception.Response.StatusCode } catch { }
            }
            if ($statusCode -ne 404) {
              throw "Could not determine whether '$packageId' already exists in microsoft/winget-pkgs: $($_.Exception.Message)"
            }
          }

          if ($packageExists) {
            Write-Host "Existing WinGet package found; submitting update for $packageId ($env:VERSION)." -ForegroundColor Cyan
            & .\wingetcreate.exe update $packageId --version "$env:VERSION" --urls "$msiUrl|x64" --token "$env:WINGET_TOKEN" --submit --no-open
          } else {
            Write-Host "No upstream manifest found; submitting the initial package manifest for $packageId ($env:VERSION)." -ForegroundColor Cyan
            & .\wingetcreate.exe submit --prtitle "New package: $packageId version $env:VERSION" --token "$env:WINGET_TOKEN" --no-open "$manifestDir"
          }

          $submissionExitCode = $LASTEXITCODE
          if ($submissionExitCode -ne 0) {
            throw "wingetcreate submission failed with exit code $submissionExitCode."
          }

          Write-Host "[+] WinGet submission completed successfully." -ForegroundColor Green
